services:
  - type: web
    name: metrology-scanner-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: METROLOGY_DATA_DIR
        value: /data
      - key: TESSERACT_LANG
        value: eng
      - key: TESSERACT_TIMEOUT_SECONDS
        value: "120"
      - key: OMP_THREAD_LIMIT
        value: "1"
